name: testflow
description: TestFlow - Premium CBT Platform for Students by Eddyrus Media
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^13.2.0

  # UI & Animations
  smooth_page_indicator: ^1.1.0

  # Storage
  shared_preferences: ^2.2.3

  # Utils
  package_info_plus: ^8.0.0
  url_launcher: ^6.3.0
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/onboarding/
